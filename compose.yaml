services:
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  user-postgres:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - user_postgres_data:/var/lib/postgresql/data

  user-api:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://app:app@user-postgres:5432/users?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: user-api-calls
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4317
    depends_on:
      - user-postgres
      - kafka
    restart: on-failure

  task-postgres:
    image: postgres:17-alpine
    ports:
      - "25432:5432"
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - task_postgres_data:/var/lib/postgresql/data

  task-api:
    build:
      context: .
      dockerfile: task/Dockerfile
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      DATABASE_URL: postgres://app:app@task-postgres:5432/tasks?sslmode=disable
      USER_GRPC_ADDR: user-api:9090
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: task-api-calls
      OTEL_EXPORTER_OTLP_ENDPOINT: alloy:4317
    depends_on:
      - task-postgres
      - user-api
      - kafka
    restart: on-failure

  kafka-logger:
    build:
      context: .
      dockerfile: kafka-logger/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: user-api-calls,task-api-calls
    depends_on:
      - kafka
    restart: on-failure

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
      - "4317:4317"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.3
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - tempo

volumes:
  user_postgres_data:
  task_postgres_data:
  loki_data:
  alloy_data:
  grafana_data:
  tempo_data:
